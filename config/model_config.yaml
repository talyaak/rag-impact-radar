llm:
  provider: openai
  model: gpt-4o
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 30
  max_retries: 3
  retry_base_delay: 1.0
embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  batch_size: 100
  cache_enabled: true
  cache_path: data/cache/embeddings.json
  cache_max_entries: 100000
vector_store:
  provider: chroma
  collection_name: impact_radar_components
  persist_directory: ./chroma_db
  distance_metric: cosine
chunking:
  chunk_size: 512
  chunk_overlap: 64
  separator: '


    '
retrieval:
  top_k: 10
  similarity_threshold: 0.7
  rerank: true
  rerank_top_k: 5
graph:
  max_traversal_depth: 3
  include_weak_coupling: true
  cycle_detection: true
analysis:
  severity_weights:
    coupling_tight: 1.0
    coupling_loose: 0.5
    coupling_optional: 0.2
  criticality_multipliers:
    critical: 4.0
    high: 2.0
    medium: 1.0
    low: 0.5
  variant_impact_threshold: 0.3
ingestion:
  component_detection: auto
  min_class_methods: 2
  max_file_size_bytes: 5000000
  languages:
  - python
  - typescript
  - javascript
  - csharp
  artifact_granularity: manifest
  ignore_patterns:
  - .git
  - __pycache__
  - node_modules
  - .venv
  - venv
  - chroma_db
gap_analysis:
  max_questions_per_round: 10
  auto_resolve_low_severity: true
  completeness_threshold: 0.8
  suggestion_batch_size: 10
  enable_llm_suggestions: true
recompilation:
  timestamp: '2026-04-22T04:35:47.233882+00:00'
  component_count: 102
  module_count: 21
  edge_count: 83
  variant_count: 8
  shared_module_count: 21
pricing:
  embedding_per_million_tokens: 0.02
  llm_input_per_million_tokens: 2.5
  llm_output_per_million_tokens: 10.0
  chars_per_token: 4
security:
  zero_data_retention: true
  privacy:
    local_only_mode: false
    redaction_level: strict
    max_prompt_length: 50000
    max_embedding_length: 10000
    max_batch_size: 100
    block_source_code: true
    blocked_patterns: []
    allow_file_paths: false
    allow_ip_addresses: false
    audit_log_path: privacy_audit.jsonl
    custom_redaction_patterns: []
