# Impact Radar - Model & Pipeline Configuration
#
# RAG Learning Note: These are the core tuning knobs for the RAG pipeline.
# - chunk_size/chunk_overlap control how component descriptions are split for embedding
# - top_k controls how many candidate results the vector search returns
# - similarity_threshold filters out low-relevance matches
# - rerank implements a two-stage retrieval pattern: cast a wide net, then refine

llm:
  provider: "openai"
  model: "gpt-4o"
  temperature: 0.2          # Low temp for factual, consistent risk explanations
  max_tokens: 4096
  timeout_seconds: 30
  max_retries: 3
  retry_base_delay: 1.0     # Exponential backoff: 1s, 2s, 4s

embedding:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 100
  # Content-hash cache: skip re-embedding text whose SHA-256 is already cached.
  # When enabled, the embedder hashes each document body before dispatching
  # to the API; cache hits are served locally for $0.
  cache_enabled: true
  cache_path: "data/cache/embeddings.json"
  cache_max_entries: 100000       # Evict oldest entries past this cap

vector_store:
  provider: "chroma"
  collection_name: "impact_radar_components"
  persist_directory: "./chroma_db"
  distance_metric: "cosine"

chunking:
  chunk_size: 512            # Tokens per chunk - balances context vs specificity
  chunk_overlap: 64          # Overlap prevents losing context at chunk boundaries
  separator: "\n\n"

retrieval:
  top_k: 10                  # First stage: retrieve 10 candidates from vector search
  similarity_threshold: 0.7  # Minimum cosine similarity to include
  rerank: true               # Second stage: rerank candidates for precision
  rerank_top_k: 5            # Final output: top 5 after reranking

graph:
  max_traversal_depth: 5     # How many hops to follow in dependency graph
  include_weak_coupling: true # Include loose/optional couplings in traversal
  cycle_detection: true       # Essential - our seed data has intentional cycles

analysis:
  severity_weights:
    coupling_tight: 1.0
    coupling_loose: 0.5
    coupling_optional: 0.2
  criticality_multipliers:
    critical: 4.0
    high: 2.0
    medium: 1.0
    low: 0.5
  variant_impact_threshold: 0.3  # Minimum score to flag a variant as affected

# ── V2: Ingestion Engine Settings ──────────────────────────────────────
ingestion:
  component_detection: "auto"    # auto | directory | class
  min_class_methods: 2           # Minimum methods for a class to be a component
  max_file_size_bytes: 5000000   # Skip files larger than 5MB
  # Which language manifests to extract components from. Python uses AST
  # on .py files; the others are manifest-driven (package.json / .csproj).
  # Drop entries here to disable a language completely.
  languages:
    - "python"
    - "typescript"
    - "javascript"
    - "csharp"
  # How coarse each emitted component is:
  #   "manifest" — one component per package.json / .csproj (default,
  #                information-preserving; coarser views derive via aggregation).
  #   "app"      — collapse nested workspace packages into their root package.json.
  #                Useful when you publish one app, not N sub-packages.
  #   "service"  — aggregate all manifests inside a service boundary (a dir
  #                with a Dockerfile, .sln, etc.) into one component.
  artifact_granularity: "manifest"
  ignore_patterns:               # Directories to skip during scanning
    - ".git"
    - "__pycache__"
    - "node_modules"
    - ".venv"
    - "venv"
    - "chroma_db"

# ── V2: Gap Analysis Settings ─────────────────────────────────────────
gap_analysis:
  max_questions_per_round: 10    # Questions per interactive round
  auto_resolve_low_severity: true # Auto-resolve LOW gaps with defaults
  completeness_threshold: 0.8    # Target completeness before marking done
  # Batched suggestion mode: pack multiple gaps into a single LLM call.
  # suggestion_batch_size=1 reproduces the legacy one-call-per-gap behavior.
  # suggestion_batch_size=10 reduces LLM calls by ~10x during onboarding.
  suggestion_batch_size: 10
  enable_llm_suggestions: true   # If false, skip LLM entirely (graph-only gaps)

# ── V2: Recompilation Settings ────────────────────────────────────────
recompilation:
  backup_before_export: true     # Backup existing data before recompiling
  auto_adjust_depth: true        # Adjust traversal depth based on graph size

# ── V2: Cost Estimation ───────────────────────────────────────────────
# Prices in USD per 1M tokens. Used by POST /api/v2/ingest/estimate to
# project cost before running the paid pipeline. Update when provider
# prices change. These are projection numbers only — not billed here.
pricing:
  embedding_per_million_tokens: 0.02     # text-embedding-3-small
  llm_input_per_million_tokens: 2.50     # gpt-4o
  llm_output_per_million_tokens: 10.00   # gpt-4o
  # Heuristic: ~4 chars per token is the standard approximation for
  # OpenAI's BPE tokenizers on English text.
  chars_per_token: 4

# ── V2: Enterprise Security & Privacy ─────────────────────────────────
#
# CRITICAL: These settings govern how proprietary code and data are
# protected when communicating with external LLM/embedding APIs.
# Enterprise deployments MUST review and configure this section.
#
security:
  # Zero data retention: instruct API providers not to store/retain data
  zero_data_retention: true

  privacy:
    # LOCAL-ONLY MODE: When true, ALL external API calls are blocked.
    # The system uses Chroma's built-in Sentence Transformers for
    # embeddings (local, no network) and skips LLM generation entirely.
    # Enable this for maximum security when no data may leave the network.
    local_only_mode: false

    # Redaction level for content sent to external APIs:
    #   strict   — Redact secrets, PII, file paths, IPs (enterprise default)
    #   moderate — Redact secrets and PII only
    #   minimal  — Redact only obvious secrets (API keys, tokens)
    redaction_level: "strict"

    # Maximum content sizes (prevent accidental bulk exfiltration)
    max_prompt_length: 50000       # Max chars per LLM prompt
    max_embedding_length: 10000    # Max chars per embedding text
    max_batch_size: 100            # Max texts per embedding batch

    # Block raw source code from being sent to LLMs
    block_source_code: true

    # Blocked patterns: content matching these strings is NEVER sent externally.
    # Add project-specific terms, internal hostnames, or classified codenames.
    blocked_patterns: []
    # Example:
    #   - "internal.corp.example.com"
    #   - "PROJECT_CLASSIFIED"
    #   - "secret-service-name"

    # Allow file paths in LLM prompts (default: false for strict mode)
    allow_file_paths: false

    # Allow IP addresses in LLM prompts (default: false for strict mode)
    allow_ip_addresses: false

    # Audit log path (append-only JSONL file tracking every external API call)
    audit_log_path: "privacy_audit.jsonl"

    # Custom redaction patterns (enterprise can add domain-specific patterns)
    # Each entry: {name: "label", pattern: "regex_pattern"}
    custom_redaction_patterns: []
    # Example:
    #   - name: "internal_hostname"
    #     pattern: "[a-z]+-[a-z]+-\\d+\\.internal\\.corp\\.com"
