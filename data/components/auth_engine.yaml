id: auth_engine
name: "AuthEngine"
description: >
  Core identity service handling authentication, authorization, and session
  lifecycle. Supports password-based login, SSO (SAML/OIDC), multi-factor
  authentication, SCIM provisioning, and API token management. All access
  control decisions for protected resources flow through this component.
team_owner: "identity-team"
criticality: critical
modules:
  - module_id: crypto_utils
    usage: "Password hashing (argon2id), JWT signing/verification, TOTP secret generation for MFA"
    coupling: tight
  - module_id: session_store
    usage: "Redis-backed session persistence, invalidation, and cross-device session tracking"
    coupling: tight
  - module_id: event_bus
    usage: "Publishes auth lifecycle events (login, logout, failed_attempt, mfa_challenge, account_locked)"
    coupling: loose
  - module_id: access_control
    usage: "RBAC/ABAC permission evaluation for authorization decisions on protected resources"
    coupling: tight
api_surface:
  - "POST /api/v1/auth/login"
  - "POST /api/v1/auth/logout"
  - "POST /api/v1/auth/refresh"
  - "GET  /api/v1/auth/verify"
  - "POST /api/v1/auth/mfa/setup"
  - "POST /api/v1/auth/mfa/verify"
  - "POST /api/v1/auth/sso/saml/callback"
  - "POST /api/v1/auth/sso/oidc/callback"
